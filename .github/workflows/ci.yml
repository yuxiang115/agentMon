name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    # Both platforms are real users of this repo (Windows-first development,
    # Linux servers/CI) — the suite is fast enough to run both.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
